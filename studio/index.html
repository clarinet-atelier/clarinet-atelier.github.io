<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarinet Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="../img/clarinet-g.webp" type="image/webp">
<style>
/* Layout idea: an instrument atelier at night. Walnut-dark ground, sage for knowledge, amber glow only where your fingers or the music are right now. Home is a product page; lessons live behind a quiet chapter rail. */
:root{
  --bg:#14100c;
  --panel:#1c1611;
  --panel2:#241c16;
  --line:#33281f;
  --line2:#45372b;
  --ink:#f4ede3;
  --muted:#b3a492;
  --sage:#9db592;
  --sage-deep:#5f7a5a;
  --sage-soft:rgba(157,181,146,.12);
  --walnut:#5c3d2a;
  --amber:#f3a83a;
  --amber-soft:rgba(243,168,58,.13);
  --display:"El Messiri","IBM Plex Sans Arabic",Georgia,serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;text-wrap:balance;line-height:1.25;margin:0}
p{margin:0}
a{color:var(--sage);text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
img{max-width:100%;display:block}
.muted{color:var(--muted)} .small{font-size:.875rem;color:var(--muted)}
.cer{color:var(--sage)} .rose{color:var(--amber)}
.ltr{direction:ltr;unicode-bidi:isolate}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;height:66px;display:flex;align-items:center;gap:18px;padding:0 28px;background:rgba(20,16,12,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink)}
.logo b{font-family:var(--display);font-size:1.12rem;letter-spacing:.3px;display:block;line-height:1.1}
.logo small{color:var(--muted);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.topnav{display:flex;gap:4px;margin-inline-start:22px;margin-inline-end:auto}
.topnav a{color:var(--muted);font-size:.9rem;padding:6px 12px;border-radius:8px}
.topnav a:hover,.topnav a[aria-current="page"]{color:var(--ink);background:var(--panel)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:.85rem;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.seg.inst button[aria-pressed="true"]{color:var(--amber)}

/* shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr)}
.shell.home{grid-template-columns:1fr}
.shell.home .rail{display:none}
.rail{position:sticky;top:66px;align-self:start;height:calc(100vh - 66px);overflow-y:auto;border-inline-end:1px solid var(--line);padding:24px 14px}
.rail h4{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;font-family:var(--body);padding:0 10px 10px}
.rail a{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px;border-radius:10px;color:var(--ink);margin-bottom:2px;border-inline-start:2px solid transparent}
.rail a:hover{background:var(--panel)}
.rail a[aria-current="page"]{background:var(--panel);border-inline-start-color:var(--amber)}
.rail .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.85rem;border:1px solid var(--line2);color:var(--muted)}
.rail a[aria-current="page"] .n{background:var(--amber);border-color:var(--amber);color:#1a1209}
.rail b{display:block;font-weight:500;font-size:.93rem;line-height:1.35}
.rail span.d{font-size:.77rem;color:var(--muted);line-height:1.4}
.rail .inst-box{margin:22px 10px 0;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:.84rem;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.rail .inst-box img{height:96px;width:auto;border-radius:6px;object-fit:cover}
main{min-width:0;padding:44px 52px 90px}
.view{max-width:1040px;margin:0 auto}
.shell.home main{padding:0 0 90px}
.shell.home .view{max-width:none}

/* page header */
.overline{font-size:.74rem;letter-spacing:.14em;color:var(--sage);font-weight:600;text-transform:uppercase}
.page-title{font-size:clamp(1.9rem,3.4vw,2.7rem);margin-top:8px}
.page-lead{color:#d8cdbf;max-width:70ch;margin-top:14px;font-size:1.04rem}
.hr{height:1px;background:var(--line);margin:30px 0}
.block{margin-top:48px}
.block-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.block-head h2{font-size:1.45rem}
.block-head .k{font-family:var(--display);font-size:.9rem;color:var(--amber);min-width:22px}

/* primitives */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tag{display:inline-flex;align-items:center;font-size:.74rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-weight:500;white-space:nowrap}
.tag.rose{color:var(--amber);border-color:rgba(243,168,58,.4);background:var(--amber-soft)}
.tag.cer{color:var(--sage);border-color:rgba(157,181,146,.4);background:var(--sage-soft)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--amber);background:var(--amber);color:#1a1209;border-radius:999px;padding:10px 22px;font-weight:600;font-size:.95rem;transition:box-shadow .2s, transform .2s}
.btn:hover{box-shadow:0 0 0 4px rgba(243,168,58,.18),0 8px 30px rgba(243,168,58,.25);transform:translateY(-1px)}
.btn.sec{background:transparent;border-color:var(--line2);color:var(--ink)}
.btn.sec:hover{border-color:var(--sage);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.term{background:none;border:0;padding:0;font:inherit;color:#c9dcbf;border-bottom:1px dashed rgba(157,181,146,.7);cursor:help;line-height:inherit}
.term:hover{color:#fff;border-bottom-color:var(--amber)}
#pop{position:fixed;z-index:80;max-width:320px;background:#221a14;border:1px solid var(--line2);border-top:2px solid var(--amber);border-radius:12px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.6);display:none}
#pop b{font-family:var(--display);font-size:1.05rem;display:block}
#pop .alt{font-size:.78rem;color:var(--sage)}
#pop p{font-size:.9rem;margin-top:6px;color:#e6dccf;line-height:1.65}
.note-tip{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--sage-soft);border:1px solid rgba(157,181,146,.3);font-size:.92rem}
.note-tip.rose{background:var(--amber-soft);border-color:rgba(243,168,58,.32)}
ul.clean,ol.clean{margin:0;padding-inline-start:20px}
ul.clean li,ol.clean li{margin-bottom:6px}

/* HOME */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:
  radial-gradient(60% 80% at 25% 40%,rgba(157,181,146,.16),transparent 70%),
  radial-gradient(40% 60% at 22% 70%,rgba(243,168,58,.10),transparent 70%),
  linear-gradient(180deg,#17120d,#14100c)}
.hero-in{max-width:1180px;margin:0 auto;padding:64px 32px 56px;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.3rem,4.6vw,3.9rem);line-height:1.15}
.hero h1 em{font-style:normal;color:var(--amber);text-shadow:0 0 40px rgba(243,168,58,.35)}
.hero p.lead{color:#dcd1c3;max-width:54ch;margin-top:18px;font-size:1.1rem}
.hero .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.duo{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:end;justify-items:center}
.duo figure{margin:0;position:relative;text-align:center}
.duo img{height:min(64vh,560px);width:auto;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04)}
.duo figure:first-child img{transform:translateY(-18px)}
.duo figcaption{margin-top:12px;font-size:.84rem;color:var(--muted)}
.duo figcaption b{display:block;color:var(--ink);font-family:var(--display);font-size:1rem}
.wrapx{max-width:1180px;margin:0 auto;padding:0 32px}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-1px}
.pillar{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;color:var(--ink);display:flex;flex-direction:column;gap:8px;transition:border-color .2s, transform .2s}
.pillar:hover{border-color:var(--line2);transform:translateY(-3px)}
.pillar .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber);font-family:var(--display);font-size:1.2rem}
.pillar h3{font-size:1.25rem}
.pillar p{color:var(--muted);font-size:.93rem}
.pillar .go{margin-top:auto;color:var(--amber);font-size:.9rem;font-weight:600}
.home-sec{margin-top:72px}
.home-sec h2{font-size:clamp(1.6rem,2.8vw,2.2rem)}
.home-sec .sub{color:var(--muted);margin-top:8px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:26px}
.stats div{background:var(--panel);padding:20px 22px}
.stats b{display:block;font-family:var(--display);font-size:2rem;line-height:1.1;color:var(--amber);font-variant-numeric:tabular-nums}
.stats span{font-size:.86rem;color:var(--muted)}
.showcase{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:26px}
.show{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:start;width:100%}
.show[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 40px rgba(243,168,58,.12)}
.show img{height:260px;width:auto;border-radius:12px;justify-self:center}
.show h3{font-size:1.3rem}
.show ul{margin:10px 0 0;padding-inline-start:18px;color:#d8cdbf;font-size:.92rem}
.cta-band{margin-top:72px;border-radius:22px;padding:40px;background:linear-gradient(120deg,rgba(95,122,90,.35),rgba(92,61,42,.35));border:1px solid var(--line2);display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-band h2{font-size:1.7rem}

/* chapter 1 */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.step .no{font-family:var(--display);font-size:.85rem;color:var(--amber);display:block;margin-bottom:6px}
.step b{display:block;font-family:var(--display);font-size:1.08rem;margin-bottom:4px}
.step p{font-size:.9rem;color:#d3c8ba}
.type{width:100%;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:center}
.type:hover{border-color:var(--line2)}
.type[aria-pressed="true"]{border-color:var(--amber)}
.type img{height:220px;width:auto;border-radius:10px;justify-self:center}
.type .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.type h3{font-size:1.2rem}
.type ul{margin:0;padding-inline-start:20px;font-size:.93rem}
.type li{margin-bottom:5px}
.type .foot{margin-top:12px;font-size:.84rem;color:var(--muted)}
.type[aria-pressed="true"] .foot{color:var(--amber)}
.solf{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px}
.solf button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;line-height:1.3}
.solf button:hover{border-color:var(--amber)}
.solf b{display:block;font-family:var(--display);font-size:1.3rem}
.solf span{font-size:.85rem;color:var(--sage)}
.octs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;align-items:end}
.octs div{border-radius:10px;padding:8px 10px;font-size:.86rem;background:var(--panel2);border:1px solid var(--line)}
.regs{display:grid;grid-template-columns:15fr 4fr 14fr 8fr;gap:4px;margin:6px 0 16px}
.regs div{height:10px;border-radius:5px}
.reglist{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.reglist div{font-size:.9rem;color:#d3c8ba}
.reglist b{display:block;margin-bottom:2px;color:var(--ink)}
.tablebox{overflow-x:auto}
.compare{width:100%;border-collapse:collapse;font-size:.93rem}
.compare th,.compare td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.compare thead td{font-family:var(--display);font-weight:600}
.compare tr:last-child th,.compare tr:last-child td{border-bottom:0}
.compare th{color:var(--muted);font-weight:500;width:26%}
.compare td.on{color:#fff;background:var(--amber-soft)}

/* glossary */
.gloss-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.gloss-tools input{flex:1;min-width:220px;font-family:inherit;font-size:.98rem;padding:11px 16px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.gitem{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.gitem b{font-family:var(--display);font-weight:600;display:block;font-size:1.05rem}
.gitem .alt{font-size:.78rem;color:var(--sage)}
.gitem p{font-size:.9rem;color:#d3c8ba;margin-top:6px;line-height:1.65}

/* basics */
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.plan div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.9rem}
.plan b{display:block;font-family:var(--display);color:var(--amber);margin-bottom:4px}

/* studio */
.studio{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.diagram{position:sticky;top:90px;background:radial-gradient(120% 60% at 50% 30%,#22301f 0%,#18130f 70%);border:1px solid var(--line);border-radius:18px;padding:14px 10px 10px}
.diagram svg{height:min(calc(100vh - 170px),780px);width:auto;display:block;margin:0 auto}
.legend{display:flex;gap:14px;justify-content:center;font-size:.76rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
.k-on{opacity:0;transition:opacity .14s}
.on .k-on{opacity:1}
.half .k-on{opacity:.55;stroke:#fff;stroke-width:1.6;stroke-dasharray:3 2}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.panel .big{font-family:var(--display);font-size:2.1rem;line-height:1.15}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.keylist{margin:10px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.keylist li{font-size:.88rem;padding:7px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:flex;gap:8px;align-items:center}
.keylist li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber);flex:none}
.groups{display:grid;gap:22px;margin-top:22px}
.group h3{font-size:1.05rem;margin-bottom:10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.group h3 span{color:var(--muted);font-family:var(--body);font-weight:400;font-size:.84rem}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center;line-height:1.25;font-weight:500;position:relative}
.chip::after{content:"";position:absolute;inset-inline:12px;top:-1px;height:2px;border-radius:2px;background:var(--c)}
.chip small{display:block;color:var(--muted);font-size:.72rem;font-weight:400}
.chip:hover{border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1a1209}
.chip[aria-pressed="true"] small{color:#4a3415}

/* maqam */
.maqam-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:14px;width:fit-content;max-width:100%}
.maqam-pick button{border:0;background:none;border-radius:10px;padding:6px 14px;font-family:var(--display);font-size:1rem;color:var(--muted)}
.maqam-pick button:hover{color:var(--ink)}
.maqam-pick button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2),inset 0 -2px 0 var(--amber)}
.scale{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:18px}
.deg{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 2px;text-align:center;line-height:1.35}
.deg .w{font-weight:600}
.deg .l{font-size:.74rem;color:var(--muted)}
.deg .c{font-size:.72rem;color:var(--sage);border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
.deg.q{border-style:dashed;border-color:rgba(243,168,58,.6)}
.deg.now{background:var(--amber);border-color:var(--amber);border-style:solid;color:#1a1209}
.deg.now .l,.deg.now .c{color:#4a3415;border-color:rgba(0,0,0,.15)}
.ajnas{display:grid;gap:6px;margin-top:6px}
.ajnas div{font-size:.8rem;padding:5px 8px;border-radius:8px;text-align:center;background:var(--sage-soft);color:#c9dcbf}
.ajnas div+div{background:var(--amber-soft);color:#f6cf91}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.ctrl label{font-size:.88rem;color:var(--muted)}
select{font-family:inherit;font-size:.92rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink)}

/* analyzer */
.drop{border:1.5px dashed var(--line2);border-radius:20px;padding:34px;text-align:center;background:linear-gradient(180deg,rgba(157,181,146,.06),transparent);transition:border-color .2s, background .2s}
.drop.over{border-color:var(--amber);background:var(--amber-soft)}
.drop h3{font-size:1.3rem}
.drop p{color:var(--muted);margin-top:6px}
.drop .btns{justify-content:center}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:18px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--amber));transition:width .2s}
.result-head{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.result-head div{background:var(--panel);padding:16px 18px}
.result-head span{font-size:.8rem;color:var(--muted);display:block}
.result-head b{font-family:var(--display);font-size:1.35rem;line-height:1.3}
.alts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.now-note{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.now-note .big{color:var(--amber)}
.phrases{display:grid;gap:10px;margin-top:16px;max-height:420px;overflow:auto;padding-inline-end:4px}
.phrase{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.phrase .h{font-size:.78rem;color:var(--muted);margin-bottom:6px}
.phrase .ns{display:flex;flex-wrap:wrap;gap:4px}
.pn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:3px 7px;font-size:.84rem}
.pn.q{border-color:rgba(243,168,58,.55);border-style:dashed}
.pn.now{background:var(--amber);color:#1a1209;border-color:var(--amber);border-style:solid}
audio{width:100%;margin-top:14px;filter:sepia(.3)}

var TEST={on:false,i:0,n:0,list:null,t0:0,sc:[],st:0};
function testList(st){ return STAGES[st-1].test.map(function(m){ return {m:m,w:spellQ(m)}; }); }
function testPanel(st){

  h+='<div class="btns"><button class="btn" type="button" id="test-go">'+L("ابدي الاختبار","Start the test")+'</button><button class="btn sec" type="button" id="test-stop" disabled>'+L("إيقاف","Stop")+'</button></div><div id="test-live" class="ex-live" aria-live="polite"></div></div></div>';
  return h;
}
function testShow(i){
  TEST.i=i; var n=TEST.list[i]; if(!n) return; setFingers("dg-test",fingerFor(n.m).list);
  document.querySelectorAll("[data-tn]").forEach(function(b){ var k=+b.getAttribute("data-tn"); b.classList.toggle("now",k===i); b.classList.toggle("done",TEST.on&&k<i); });
}
function testStop(){ if(TEST.on) pitchStop(); TEST.on=false; var g=document.getElementById("test-go"),s=document.getElementById("test-stop"); if(g) g.disabled=false; if(s) s.disabled=true; }
function testStart(st){
  testStop(); TEST.st=st; TEST.list=testList(st); TEST.sc=[]; var lv=document.getElementById("test-live");
  document.getElementById("test-go").disabled=true; document.getElementById("test-stop").disabled=false;
  lv.innerHTML=L("جاي أشغّل المايك…","Starting the microphone…");
  pitchStart(function(err){
    if(err){ lv.innerHTML='<span class="rose">'+err+'</span>'; testStop(); return; }
    TEST.on=true; var i=0, hold=0, lastT=performance.now(), nt=performance.now(); testShow(0);
    PITCH.onframe=function(f){
      if(!TEST.on) return; var now=performance.now(), dt=(now-lastT)/1000; lastT=now; var n=TEST.list[i], msg='<b>'+L("اعزف: ","Play: ")+nmLong(n.w)+'</b>';
      if(f>0){ var wm=hz2midi(f)+INST[inst].t, dc=(wm-n.m)*100, tol=n.w.a%1?32:24;
        msg+=' · '+L("تسمع: ","hearing: ")+nmLong(spellQ(wm))+' <span class="ltr">'+(dc>0?"+":"")+Math.round(dc)+'¢</span>';
        if(Math.abs(dc)<=tol){ hold+=dt; msg+=' <span class="ok">✓</span>'; } else hold=Math.max(0,hold-dt*2);
      } else { hold=Math.max(0,hold-dt); msg+=' · '+L("ما دا أسمع صوت","no sound yet"); }
      if(hold>=0.35){ hold=0; var took=(now-nt)/1000; nt=now; TEST.sc.push(took<=4?100:Math.max(40,100-(took-4)*5)); i++;
        if(i>=TEST.list.length){ testStop(); var score=TEST.sc.reduce(function(a,b){return a+b;},0)/TEST.sc.length, pass=score>=80;
          accReport("test:stage"+st,score,{per:TEST.sc.map(Math.round),inst:inst});
          document.getElementById("test-live").innerHTML='<b class="'+(pass?'ok':'rose')+'">'+L("درجتك: ","Your score: ")+num(Math.round(score))+'/١٠٠</b><br>'+(pass?L("نجحت بالاختبار! النتيجة وصلت للأستاذ، وهو يفتحلك المرحلة الجاية ويه التجديد.","You passed! Your result has been sent to your teacher, who opens the next stage with your renewal."):L("تحتاج ٨٠ حتى تنجح. تمرّن شوية وعيد الاختبار، تگدر تعيده شگد ما تريد.","You need 80 to pass. Practise a little and try again, as often as you like."));
          return; }
        testShow(i); }
      var lv3=document.getElementById("test-live"); if(lv3) lv3.innerHTML=msg+'<div class="small" style="margin-top:6px">'+L("النوتة ","Note ")+num(i+1)+L(" من "," of ")+num(TEST.list.length)+'</div>';
    };
  });
}

function maqamNotes(mq,ts){

  var conc=base.map(function(n){return trans(n,dl,ds);}),wr=conc.map(function(n){return trans(n,d.dl,d.t);});
  var lo=midiOf(wr[0]),hi=midiOf(wr[7]),k=0;
  while(lo+12*k<52) k++;

  if(k){ conc=conc.map(function(n){return sp(n.l,n.a,n.o+k);}); wr=wr.map(function(n){return sp(n.l,n.a,n.o+k);}); }
  return {conc:conc,wr:wr};

function exList(mq){

   {id:"long",t:["نغمات طويلة","Long tones"],d:["كل درجة نفَسين. ركّز على صوت ثابت وطبقة دقيقة، خصوصاً الدرجات اللي بيها ربع تون.","Two beats on every degree. Aim for a steady tone and exact pitch, especially on quarter-tone degrees."],seq:L1,bpm:60},
   {id:"jins",t:["الجنس الأول","The lower jins"],d:["الأربع (أو الثلاث) نوتات اللي تبني هوية المقام. كرّرها لحد ما تحفظ مسافاتها بالأذن.","The first four (or three) notes that give the maqam its identity. Repeat until the intervals live in your ear."],seq:jn,bpm:80},
   {id:"thirds",t:["الثالثات","Thirds"],d:["قفزات ثالثة صعوداً ونزولاً. تقوّي الأصابع وتعلّمك تسمع الدرجة قبل ما تعزفها.","Leaps of a third up and down. Builds finger agility and teaches you to hear each degree before you play it."],seq:th,bpm:76},
   {id:"fours",t:["سلاسل رباعية","Four-note sequences"],d:["مجموعات من أربع نوتات تمشي درجة درجة. هذا التمرين الأساسي للتقاسيم.","Groups of four moving step by step: the backbone of taqsim playing."],seq:fo,bpm:84},
   {id:"upper",t:["الجنس الثاني والرجوع","Upper jins and return"],d:["من نهاية الجنس الأول للجواب ورجوعاً للقرار، حتى تحس كيف يتصل الجنسين.","From the top of the first jins to the octave and back to the tonic, to feel how the two ajnas join."],seq:uj,bpm:76},
   {id:"phrase",t:["جملة بالمقام","A maqam phrase"],d:["جملة قصيرة تمشي على سير المقام وتنتهي بالقفلة على القرار. اعزفها بإحساس وبدون استعجال.","A short phrase that follows the maqam’s path and closes on the tonic. Play it expressively, unhurried."],seq:MQ_PHR[mq.id],bpm:72}
  ];
}
var PIECES=[];
/* every maqam: its real pieces first, then the six technical drills */
function exItems(mq){
  var ps=PIECES.filter(function(p){return p.mq===mq.id;}).map(function(p){ return {id:p.id,piece:p,bpm:p.bpm,t:p.t,
    d:[p.frm[0]+". اعزف أول جملة منها، وهي مكتوبة على القرار الشائع للمقام حتى تطابق صفحة المقامات.", p.frm[1]+". Play its opening phrase, written on the maqam’s usual tonic so it matches the maqam page."]}; });
  return ps.concat(exList(mq));
}

function exNotes(){
  var mq0=MAQAM.filter(function(q){return q.id===EX.mq;})[0], it=exItems(mq0)[EX.i]||exItems(mq0)[0];
  if(it.piece){ var d=INST[inst], sc=maqamNotes(mq0,mq0.tonic).conc, lst=[], tt=0;
    it.piece.notes.forEach(function(n){ if(n[0]!==null){ var c=spellConcert(n[0],sc), w=trans(c,d.dl,d.t); lst.push({deg:-1,w:w,c:c,beats:n[1],at:tt}); } tt+=n[1]; });
    return {mq:mq0,ex:it,list:lst,beats:tt,r:null,piece:it.piece}; }
  var mq=mq0, r=maqamNotes(mq,EX.ton), ex=it, dn=MQ_DOWN[mq.id]||{}, out=[], prev=-1, t=0;
  ex.seq.forEach(function(st){ var d=st[0], w=r.wr[d], c=r.conc[d], alt=(prev>d&&dn[d])?dn[d]:0;
    if(alt){ w=sp(w.l,w.a+alt,w.o); c=sp(c.l,c.a+alt,c.o); }
    out.push({deg:d,w:w,c:c,beats:st[1],at:t}); t+=st[1]; prev=d; });

}

    ST.dur=v.duration||ST.dur; ST.ready=true;
    var po=document.getElementById("st-poster"), ld=document.getElementById("st-load");
    if(po) po.style.opacity=0; if(ld) ld.style.display="none";
    try{ v.currentTime=ST.cur; }catch(e){}
  },{once:true});
  v.preload="auto"; v.src=ST.url; v.load();
}
function stProgress(){
  var sec=document.getElementById("st"); if(!sec) return -1;
  var r=sec.getBoundingClientRect(), span=sec.offsetHeight-window.innerHeight;
  return Math.min(1,Math.max(0,-r.top/span));
}
function stClamp(x){ return Math.min(1,Math.max(0,x)); }
function stScroll(){
  var top=document.querySelector(".topbar"), sec=document.getElementById("st");
  if(!sec){ if(top) top.classList.remove("solid"); musSilence(); return; }
  var p=stProgress(), tm=p*(ST.dur-0.05), k=0;
  ST.target=tm;
  STEPS.forEach(function(s,i){ if(tm>=s.at[0]) k=i; });
  var inWin=tm<=STEPS[k].at[1];
  document.querySelectorAll(".st-panel").forEach(function(el,i){ el.classList.toggle("on",i===k&&inWin); });
  document.querySelectorAll(".st-rail b").forEach(function(b,i){ var s=STEPS[i+1]; b.style.setProperty("--p",stClamp((tm-s.at[0])/(s.at[1]-s.at[0]))); });
  var br=STEPS[3], hz=document.getElementById("ro-hz");
  if(hz) hz.textContent=Math.round(stClamp((tm-br.at[0])/4.5)*440)+" Hz";
  if(top) top.classList.toggle("solid",window.scrollY>sec.offsetHeight-window.innerHeight*1.1);
  var past=(window.scrollY-(sec.offsetHeight-window.innerHeight*1.6))/(window.innerHeight*0.6); MUS.target=Math.max(0,Math.min(1,1-past)); if(MUS.target>0.01&&MUS.el&&MUS.el.paused&&MUS.ok) musPlay();
}
function stTick(){
  ST.cur+=(ST.target-ST.cur)*(stReduce?1:0.14);
  musTick();
  var v=document.getElementById("st-vid");
  if(v&&ST.ready&&v.readyState>=1&&Math.abs(v.currentTime-ST.cur)>0.03&&!v.seeking){ try{ v.currentTime=ST.cur; }catch(e){} }
  requestAnimationFrame(stTick);
}
window.addEventListener("scroll",stScroll,{passive:true});
window.addEventListener("resize",stScroll);
requestAnimationFrame(stTick);

function render(){
  stopChrom(); stopMaqam(); hidePop(); stopAnPlay(); stopEx(); stopTools(); testStop();
  var cur=route(); renderChrome(cur); document.body.classList.toggle("home",cur==="start");
  if(gate==="ok"&&cur==="maqamat") curMaqam=firstOpenMq(curMaqam); if(cur==="practice") EX.mq=firstOpenMq(EX.mq);
  var gate=IS_STUDIO&&ACC.mode!=="owner"?"login":(cur==="course"?"course":(cur==="admin"?(canSee("admin")?"admin":"lock"):(canSee(cur)?"ok":"lock")));
  var v=gate==="login"?vOwnerLogin():gate==="course"?vCourse():gate==="admin"?vAdmin():gate==="lock"?vLocked(cur):{start:vStart,instrument:vInstrument,basics:vBasics,notes:vNotes,maqamat:vMaqam,practice:vPractice,tools:vTools,analyzer:vAnalyzer,glossary:vGlossary}[cur]();
  document.getElementById("view").innerHTML=v;
  if(gate==="ok"&&cur==="start"){ stLoad(); stScroll(); musInit(); musBtn(); document.getElementById("st-snd").onclick=musToggle; }
  else { var tb=document.querySelector(".topbar"); if(tb) tb.classList.remove("solid"); }
  if(gate==="ok"&&cur==="notes") selectNote(curNote,false);
  if(gate==="ok"&&cur==="maqamat") renderMaqam();
  if(gate==="ok"&&cur==="practice") renderEx();
  if(gate==="course") bindCourse(); if(gate==="admin") bindAdmin(); if(gate==="login") bindOwnerLogin();
  if(gate==="lock"){ var cf=document.getElementById("code-form"); if(cf) cf.onsubmit=function(e){ e.preventDefault(); memberLogin(document.getElementById("code-in").value); render(); }; }
  if(gate==="ok"&&(cur==="maqamat"||cur==="practice")) lockMqChips();
  if(gate==="ok"&&cur==="tools") bindTools();
  if(gate==="ok"&&cur==="glossary"){ renderGloss(); var gs=document.getElementById("gsearch"); gs.value=gq; gs.oninput=function(){ gq=gs.value; renderGloss(); };
    document.querySelectorAll("#gfilter button").forEach(function(b){ b.setAttribute("aria-pressed",b.getAttribute("data-c")===gc?"true":"false"); }); }
  if(gate==="ok"&&cur==="instrument"){
    document.getElementById("demo12").onclick=function(){ var d=INST[inst]; playMidi(52-d.t,0.9); playMidi(71-d.t,1.1,1.0); };
    document.getElementById("demoT").onclick=function(){ var d=INST[inst]; playMidi(60,0.9); playMidi(60-d.t,1.1,1.0); };
  }
  if(gate==="ok"&&cur==="analyzer"){
    var fi=document.getElementById("an-file"), dz=document.getElementById("drop");
    fi.onchange=function(){ if(fi.files[0]) analyzeBlob(fi.files[0],fi.files[0].name); };
    dz.ondragover=function(e){ e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave=function(){ dz.classList.remove("over"); };
    dz.ondrop=function(e){ e.preventDefault(); dz.classList.remove("over"); var f=e.dataTransfer.files[0]; if(f) analyzeBlob(f,f.name); };
    document.getElementById("an-mic").onclick=function(){ toggleMic(this); };
    if(AN.res) renderAnalysis();
  }
}
var lastRoute=null;
window.addEventListener("hashchange",function(){ render(); if(lastRoute!==route()) window.scrollTo(0,0); lastRoute=route(); });
document.addEventListener("click",function(e){
  var t=e.target.closest(".term"); if(t){ e.preventDefault(); e.stopPropagation(); showPop(t); return; }
  if(!e.target.closest("#pop")) hidePop();
  var b;
  if((b=e.target.closest("#inst-seg button"))||(b=e.target.closest(".type"))||(b=e.target.closest(".show"))||(b=e.target.closest(".st-pick"))){ inst=b.getAttribute("data-inst"); try{localStorage.setItem("clar-inst",inst);}catch(err){} render(); return; }
  if((b=e.target.closest("#lang-seg button"))){ lang=b.getAttribute("data-lang"); try{localStorage.setItem("clar-lang",lang);}catch(err){} render(); return; }
  if((b=e.target.closest("[data-solf]"))){ playMidi(60+NAT[+b.getAttribute("data-solf")],0.8); return; }
  if((b=e.target.closest(".chip[data-m]"))){ stopChrom(); selectNote(+b.getAttribute("data-m"),true); return; }
  if((b=e.target.closest("[data-exmq]"))){ EX.mq=b.getAttribute("data-exmq"); EX.ton=null; EX.bpm=null; EX.i=0; renderEx(); return; }
  if((b=e.target.closest("[data-exi]"))){ EX.i=+b.getAttribute("data-exi"); EX.bpm=null; renderEx(); return; }
  if((b=e.target.closest(".exn[data-exn]"))){ if(EX.mode!=="mic"){ stopEx(); exShow(+b.getAttribute("data-exn"),true); } return; }
  if((b=e.target.closest("[data-mq]"))){ curMaqam=b.getAttribute("data-mq"); curTonic=null; renderMaqam(); return; }
  if((b=e.target.closest("#gfilter button"))){ gc=b.getAttribute("data-c"); document.querySelectorAll("#gfilter button").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false");}); renderGloss(); return; }
  if((b=e.target.closest(".pn[data-ni]"))){ var au=document.getElementById("an-audio"), nt=AN.notes[+b.getAttribute("data-ni")]; if(au&&nt){ au.currentTime=nt.t0+0.01; tickAn(true); playMidi(nt.m,Math.min(1,nt.t1-nt.t0)); } return; }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape") hidePop(); });
window.addEventListener("scroll",hidePop,{passive:true});
var pop=document.getElementById("pop");
function showPop(btn){
  var g=GL[btn.getAttribute("data-t")]; if(!g) return;
  pop.innerHTML='<b>'+(lang==="ar"?g[0]:g[1])+'</b><span class="alt">'+(lang==="ar"?g[1]:g[0])+'</span><p>'+(lang==="ar"?g[2]:g[3])+'</p>';
  pop.dir=lang==="ar"?"rtl":"ltr"; pop.style.display="block";
  var r=btn.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  var x=Math.min(Math.max(12,r.left+r.width/2-pw/2),vw-pw-12),y=r.bottom+8; if(y+ph>vh-8) y=Math.max(8,r.top-ph-8);
  pop.style.left=x+"px"; pop.style.top=y+"px";
}
function hidePop(){ pop.style.display="none"; }
document.addEventListener("pointerdown",function pre(){ if(ensureAudio()) loadSamples(); document.removeEventListener("pointerdown",pre,true); },true);
lastRoute=route();
render();
if(IS_STUDIO) ownerStart(); else if(accCode()) memberLogin(accCode(),true);

})();
</script>
</body>
</html>
