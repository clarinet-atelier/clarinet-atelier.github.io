# Keeps the free Supabase project awake: it pauses after 7 days without activity.
name: Keep database awake
on:
  schedule:
    - cron: "17 6 */3 * *"   # every 3 days
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_qqLiBeKQRc7GSIEY7ncU_Q_DRQVM7jy" \
            "https://vicvkswqpopbhjrcrdrf.supabase.co/rest/v1/content?select=key&limit=1")
          echo "Supabase answered $code"
          test "$code" = "200"
